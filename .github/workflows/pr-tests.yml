name: PR tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Run VM test suite
        run: python3 .github/scripts/test-summary.py
      - name: Upload VM test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finix-vm-test-results
          path: test-results
          if-no-files-found: warn
