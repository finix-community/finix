name: "apply statix check"

on:
  push:
    paths:
      - '**.nix'
  pull_request:
    paths:
      - '**.nix'

jobs:
  statix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Statix check
        run: nix-shell ./shell.nix --command 'statix check'
